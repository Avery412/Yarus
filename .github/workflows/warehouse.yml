name: Warehouse checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      YARUS_DB_HOST: 127.0.0.1
      YARUS_DB_USERNAME: postgres
      YARUS_DB_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: npm ci
      - run: npm run build
      - run: bundle exec rails db:prepare
      - run: bundle exec rails zeitwerk:check
      - run: bundle exec rails test
      - run: bundle exec rails test:system
